<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Динамическая форма</title>
</head>
<body>
    <header>
        <h1>Динамическая форма</h1>
    </header>
    
    <main>
        <form id="myForm">
            <label for="name">Имя:</label>
            <input type="text" id="name" required>
            
            <label for="address">Адрес:</label>
            <input type="text" id="address" required>
            
            <label for="age">Возраст:</label>
            <input type="number" id="age" required>
            
            <label for="position">Должность:</label>
            <input type="text" id="position" required>
            <p></p>
            <p></p>
            
            <div>
                <label>Размер шрифта:</label>
                <input type="radio" name="fontSize" value="small"> Маленький
                <input type="radio" name="fontSize" value="medium" checked> Средний
                <input type="radio" name="fontSize" value="large"> Большой
            </div>
            <p></p>
            <p></p>
            
            <button type="button" id="loadData">Загрузить данные</button>
            <button type="button" id="loadMedia">Загрузить медиа</button>
            <button type="button" id="clearForm">Очистить форму</button>
        </form>
        <p></p>
        <p></p>
        
        <div id="mediaContainer"></div>
    </main>
    
    <footer>
        <p>© 2023 Динамическая форма</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
